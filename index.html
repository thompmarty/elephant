<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta charset="utf-8" />
  <meta name="theme-color" content="#05060B" />
  <title>Lava Lamp</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #05060B;
      color: #cfd0d6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      height: 100%;
    }
    canvas { display: block; }
    #motion-gate {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #0c0d16 0%, #05060B 70%);
      z-index: 10;
    }
    #motion-gate.visible { display: flex; }
    #motion-gate button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e8e8ee;
      padding: 14px 22px;
      font-size: 15px;
      letter-spacing: 0.04em;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #motion-gate small {
      display: block;
      margin-top: 14px;
      opacity: 0.55;
      font-size: 12px;
      text-align: center;
    }
    #motion-gate .inner { text-align: center; padding: 20px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.js"></script>
  <script src="sketch.js" defer></script>
</head>
<body>
  <div id="motion-gate">
    <div class="inner">
      <button id="motion-btn">Enable motion</button>
      <small>Tilt your phone to steer the blobs</small>
    </div>
  </div>
</body>
</html>
